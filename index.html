<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>🎫受付管理</title>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <link rel="stylesheet" href="admin1.css">

</head>


<body>

    <header>

        <h1>受付</h1>

        <p>
            整理券のQRコードを読み取ってください
        </p>

    </header>


    <main>


        <!-- 現在の日付 -->

        <div id="currentDay">

            読み込み中...

        </div>


        <!-- スキャン開始 -->

        <button id="startBtn">

            QRスキャン開始

        </button>


        <!-- QRリーダー -->

        <div id="reader"></div>


        <!-- カメラ停止 -->

        <button id="stopBtn">

            カメラを閉じる

        </button>


        <!-- 結果 -->

        <section id="result"></section>


        <!-- 再スキャン -->

        <button id="retryBtn">

            次の整理券を読み取る

        </button>


    </main>


    <script
        type="module"
        src="admin1.js"
    ></script>

</body>

</html>
